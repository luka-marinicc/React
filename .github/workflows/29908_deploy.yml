name: 29908 Deploy

on:
  workflow_run:
    workflows: ["29908 Test"]
    types: [completed]

jobs:
  deploy:
    # Posel se izvede na self-hosted runnerju.
    runs-on: self-hosted

    # Deploy se izvede samo, če se je testna skripta uspešno zaključila.
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      # Prenos kode iz repozitorija.
      - uses: actions/checkout@v4

      # Prijava v DockerHub z GitHub secrets.
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Zgradimo Docker sliko iz Dockerfile datoteke v trenutni mapi.
      - name: Build Docker image
        run: |
          cd backend
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/vaja3:latest .

      # Objavimo Docker sliko na DockerHub repozitorij.
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/vaja3:latest
